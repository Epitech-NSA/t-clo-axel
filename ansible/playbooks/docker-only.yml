---
# Playbook for Docker installation only
# Useful for initial setup or when only Docker needs to be installed/updated

- name: Install Docker on all hosts
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Wait for system to be ready
      wait_for_connection:
        timeout: 300

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: docker
      tags: ['docker']

  post_tasks:
    - name: Verify Docker installation
      command: docker --version
      register: docker_version_output
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "Docker installed: {{ docker_version_output.stdout }}"

    - name: Verify Docker service status
      systemd:
        name: docker
        state: started
      check_mode: yes
      register: docker_service

    - name: Display service status
      debug:
        msg: "Docker service is {{ 'running' if docker_service.status.ActiveState == 'active' else 'not running' }}"


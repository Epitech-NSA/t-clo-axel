---
# Common variables for all hosts

# Azure Container Registry
acr_name: "tcdevacrfrc01"
acr_login_server: "tcdevacrfrc01.azurecr.io"

# Docker image
docker_image_name: "sample-app"
docker_image_tag: "latest"
docker_image_full: "{{ acr_login_server }}/{{ docker_image_name }}:{{ docker_image_tag }}"

# Application settings
app_container_name: "laravel-app"
app_port: 80
app_directory: "/opt/app"

# MySQL Database connection (to be provided during deployment)

name: Deploy PaaS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
      dry_run:
        description: 'Run in dry-run mode (plan only)'
        required: false
        type: boolean
        default: false

env:
  TF_VERSION: '~1.6.0'

jobs:
  deploy-paas:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Setup environment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "dev" ]; then
            echo "ACR_NAME=tcdevacrfrc01" >> $GITHUB_ENV
          else
            echo "ACR_NAME=tcprodacrfrc01" >> $GITHUB_ENV
          fi
      
      - name: Terraform Init
        run: |
          cd terraform
          terraform init
      
      - name: Select Terraform Workspace
        run: |
          cd terraform
          terraform workspace select ${{ github.event.inputs.environment }} || \
          terraform workspace new ${{ github.event.inputs.environment }}
      
      - name: Terraform Plan
        id: plan
        run: |
          cd terraform
          terraform plan \
            -target=module.rg \
            -target=module.network \
            -target=module.acr \
            -target=module.mysql \
            -target=module.appservice \
            -target=azurerm_role_assignment.webapp_acr_pull \
            -var="mysql_admin_password=${{ secrets.MYSQL_PASSWORD }}" \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan
      
      - name: Terraform Apply
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
      
      - name: Get App Service URL
        if: ${{ github.event.inputs.dry_run == 'false' }}
        id: app_url
        run: |
          cd terraform
          APP_URL=$(terraform output -raw app_service_url 2>/dev/null || echo "")
          if [ -n "$APP_URL" ]; then
            echo "url=$APP_URL" >> $GITHUB_OUTPUT
            echo "App Service URL: $APP_URL"
          fi
      
      - name: Wait for App Service to be ready
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "Waiting for App Service to start..."
          sleep 60
      
      - name: Run health check
        if: ${{ github.event.inputs.dry_run == 'false' && steps.app_url.outputs.url != '' }}
        run: |
          echo "Testing App Service endpoint..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.app_url.outputs.url }} || echo "000")
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" == "200" ]; then
            echo "✓ Health check passed!"
          else
            echo "⚠ Health check returned: $HTTP_CODE (app may still be starting)"
          fi
      
      - name: Deployment summary
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          echo "## PaaS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Service URL**: ${{ steps.app_url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "## Dry Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No changes were applied. Review the plan above." >> $GITHUB_STEP_SUMMARY

